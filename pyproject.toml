[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snatchguard"
version = "0.1.0"
description = "Live, rule-based chain-snatching detection at the edge with a central alert dashboard"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
edge = ["ultralytics>=8.4", "openvino>=2024.0", "lap>=0.5"]
central = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pydantic>=2.7"]
dev = ["pytest>=8"]
train = ["huggingface_hub>=0.24"]
learned = ["torch>=2.2", "torchvision>=0.17", "scikit-learn>=1.4"]

[project.scripts]
snatchguard-edge = "snatchguard.edge.__main__:main"
snatchguard-central = "snatchguard.central.__main__:main"

[tool.setuptools.packages.find]
include = ["snatchguard*", "training*"]

[tool.setuptools.package-data]
"snatchguard.central" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

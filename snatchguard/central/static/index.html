<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnatchGuard Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>SnatchGuard</h1>
        <p>Live chain-snatching alerts</p>
      </div>
    </div>
    <div class="kpis" id="kpis">
      <div class="kpi kpi-red"><span id="k-confirmed">0</span><label>Confirmed today</label></div>
      <div class="kpi kpi-amber"><span id="k-suspect">0</span><label>Suspect today</label></div>
      <div class="kpi"><span id="k-open">0</span><label>Awaiting review</label></div>
      <div class="kpi"><span id="k-cams">0/0</span><label>Cameras live</label></div>
    </div>
    <div class="topbar-right">
      <button id="sound-btn" class="ghost" title="Alert sound">🔔 Sound on</button>
      <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">Connecting…</span></span>
    </div>
  </header>

  <main class="layout">
    <section class="panel feed">
      <div class="panel-head">
        <h2>Alerts</h2>
        <nav class="tabs" id="tabs">
          <button data-filter="open" class="active">Open</button>
          <button data-filter="all">All</button>
          <button data-filter="snatch">Snatch</button>
          <button data-filter="system">Camera health</button>
          <button data-filter="reviewed">Reviewed</button>
        </nav>
      </div>
      <div id="feed" class="feed-list" aria-live="polite"></div>
      <div id="feed-empty" class="empty">No alerts. Cameras are being watched.</div>
    </section>

    <aside class="panel cams">
      <div class="panel-head"><h2>Cameras</h2><span class="muted" id="cam-summary"></span></div>
      <div id="cams" class="cam-grid"></div>
      <div id="cams-empty" class="empty">No edge nodes have reported yet.</div>
    </aside>
  </main>

  <div id="toasts" class="toasts"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="close" id="modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
